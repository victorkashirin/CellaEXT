name: Build Cella-EXT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  rack-sdk-version: 2.6.6
  rack-plugin-toolchain-dir: /home/build/rack-plugin-toolchain

defaults:
  run:
    shell: bash

jobs:
  build-win-linux:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qno/rack-plugin-toolchain-win-linux
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        platform: [win-x64, lin-x64]
    steps:
      - name: Check out Cella-EXT
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare sfizioso
        run: tools/sfz/bootstrap.sh

      - name: Get Rack SDK
        run: |
          sdk_dir="$RUNNER_TEMP/rack-sdk-${{ matrix.platform }}"
          wget -O "$RUNNER_TEMP/Rack-SDK.zip" \
            "https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-${{ matrix.platform }}.zip"
          mkdir -p "$sdk_dir"
          unzip -q "$RUNNER_TEMP/Rack-SDK.zip" -d "$sdk_dir"
          echo "RACK_SDK_DIR=$sdk_dir/Rack-SDK" >> "$GITHUB_ENV"

      - name: Build plugin
        run: |
          export PLUGIN_DIR="$GITHUB_WORKSPACE"
          cd "${{ env.rack-plugin-toolchain-dir }}"
          case "${{ matrix.platform }}" in
            lin-x64) sdk_variable=RACK_DIR_LIN_X64 ;;
            win-x64) sdk_variable=RACK_DIR_WIN_X64 ;;
          esac
          make "$sdk_variable=$RACK_SDK_DIR" "plugin-build-${{ matrix.platform }}"
          cd plugin-build
          sha256sum *.vcvplugin > "checksum_${{ matrix.platform }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.rack-plugin-toolchain-dir }}/plugin-build/*.vcvplugin
            ${{ env.rack-plugin-toolchain-dir }}/plugin-build/checksum_*.txt
          if-no-files-found: error

  build-mac:
    name: mac-${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - name: Check out Cella-EXT
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare sfizioso
        run: tools/sfz/bootstrap.sh

      - name: Get Rack SDK
        run: |
          sdk_dir="$RUNNER_TEMP/rack-sdk-mac-${{ matrix.platform }}"
          curl -fL \
            "https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-mac-${{ matrix.platform }}.zip" \
            -o "$RUNNER_TEMP/Rack-SDK.zip"
          mkdir -p "$sdk_dir"
          unzip -q "$RUNNER_TEMP/Rack-SDK.zip" -d "$sdk_dir"
          echo "RACK_SDK_DIR=$sdk_dir/Rack-SDK" >> "$GITHUB_ENV"

      - name: Build plugin
        run: |
          case "${{ matrix.platform }}" in
            x64) cross_compile=x86_64-apple-darwin ;;
            arm64) cross_compile=arm64-apple-darwin ;;
          esac
          make \
            RACK_DIR="$RACK_SDK_DIR" \
            CROSS_COMPILE="$cross_compile" \
            dist
          cd dist
          shasum -a 256 *.vcvplugin > "checksum_mac-${{ matrix.platform }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.platform }}
          path: |
            dist/*.vcvplugin
            dist/checksum_*.txt
          if-no-files-found: error

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-win-linux, build-mac]
    permissions:
      contents: write
    steps:
      - name: Check out Cella-EXT
        uses: actions/checkout@v4

      - name: Check plugin version against tag
        run: |
          plugin_version=$(jq -r '.version' plugin.json)
          if [[ "v$plugin_version" != "$GITHUB_REF_NAME" ]]; then
            echo "plugin.json version v$plugin_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Cella-EXT ${{ github.ref_name }}
          body: Cella-EXT VCV Rack plugin ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            _artifacts/**/*.vcvplugin
            _artifacts/**/checksum_*.txt
          fail_on_unmatched_files: true
